<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <!-- 发光效果 -->
    <defs>
        <filter id="glow-large">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <linearGradient id="grad-large" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ff1493;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ff69b4;stop-opacity:1" />
        </linearGradient>
        <radialGradient id="shine-large" cx="40%" cy="40%" r="60%" fx="40%" fy="40%">
            <stop offset="0%" style="stop-color:white;stop-opacity:0.6"/>
            <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
        </radialGradient>
    </defs>
    
    <!-- 背景光晕 -->
    <circle cx="64" cy="64" r="60" fill="url(#grad-large)" filter="url(#glow-large)"/>
    
    <!-- 光泽效果 -->
    <circle cx="44" cy="44" r="40" fill="url(#shine-large)" opacity="0.3"/>
    
    <!-- 音符装饰 -->
    <g transform="translate(32,32) scale(4)" fill="white" filter="url(#glow-large)">
        <path d="M8 4L16 2V14M16 14C16 16.2 14.2 18 12 18C9.8 18 8 16.2 8 14C8 11.8 9.8 10 12 10C14.2 10 16 11.8 16 14Z"/>
    </g>
    
    <!-- 装饰性光点 -->
    <circle cx="90" cy="30" r="4" fill="white" opacity="0.8" filter="url(#glow-large)"/>
    <circle cx="30" cy="90" r="3" fill="white" opacity="0.6" filter="url(#glow-large)"/>
    <circle cx="100" cy="80" r="2" fill="white" opacity="0.7" filter="url(#glow-large)"/>
</svg> 